<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CatPawAI Proxy Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="dashboard">
    <header class="glass-panel header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>CatPawAI Proxy</h1>
      </div>
      <div class="header-controls">
        <div class="status-indicator">
          <span class="dot active" id="proxyStatusDot"></span>
          <span id="proxyStatusText">Proxy Active</span>
        </div>
        <button id="toggleProxyBtn" class="btn btn-outline">Disable Proxy</button>
        <button id="exitBtn" class="btn btn-danger">Exit Server</button>
      </div>
    </header>

    <section class="glass-panel controls-section">
      <div class="control-group">
        <h3>Authentication State</h3>
        <p class="subtitle">Current Token: <span id="tokenPreview" class="code-span">Loading...</span></p>
        <button id="refreshBtn" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon spin-on-active"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          Refresh State Now
        </button>
      </div>

      <div class="divider"></div>

      <div class="control-group">
        <h3>Auto-Refresh</h3>
        <p class="subtitle">Set an interval to refresh the state automatically.</p>
        <div class="auto-refresh-controls">
          <select id="autoRefreshSelect" class="input-select">
            <option value="0">Disabled</option>
            <option value="1800000">Every 30 Minutes</option>
            <option value="3600000">Every 1 Hour</option>
            <option value="7200000">Every 2 Hours</option>
            <option value="14400000">Every 4 Hours</option>
            <option value="custom">Custom (ms)...</option>
          </select>
          <input type="number" id="customIntervalInput" class="input-text hidden" placeholder="Interval in ms" />
          <button id="applyAutoRefreshBtn" class="btn btn-secondary">Apply</button>
        </div>
      </div>
    </section>

    <section class="glass-panel logs-section">
      <div class="logs-header">
        <h3>Live Logs</h3>
        <button id="clearLogsBtn" class="btn btn-icon" title="Clear Logs">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
      <div class="terminal-container" id="terminal">
        <div class="log-line info">Waiting for logs...</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
